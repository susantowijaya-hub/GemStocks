<!doctype html>
<html lang="en" class="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stocks" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Stocks — Global Market Terminal</title>
    <meta
      name="description"
      content="Multi-asset global market dashboard, real-time crypto WebSocket feed, portfolio tracker, FX matrix, breaking financial news, and economic calendar."
    />
    <meta property="og:title" content="Stocks — Global Market Terminal" />
    <meta
      property="og:description"
      content="Multi-asset global market dashboard, real-time crypto WebSocket feed, portfolio tracker, FX matrix, breaking financial news, and economic calendar."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('stocks-theme') || localStorage.getItem('stocks-theme-mode');
          var mode =
            saved === 'arctic' || saved === 'parchment' || saved === 'obsidian' || saved === 'velvet'
              ? saved
              : 'obsidian';
          var root = document.documentElement;
          root.classList.remove('obsidian', 'velvet', 'dark', 'arctic', 'parchment');
          root.classList.add(mode);
          if (mode === 'obsidian' || mode === 'velvet') root.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <style>
      #boot-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #0b0e14;
        color: #f0f3fa;
        font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", system-ui, sans-serif;
      }
      html.arctic #boot-shell {
        background: #f4f6f9;
        color: #0a2540;
      }
      html.parchment #boot-shell {
        background: #f4f0e6;
        color: #191815;
      }
      html.velvet #boot-shell {
        background: radial-gradient(ellipse 85% 42% at 50% -8%, rgba(249, 87, 75, 0.14), rgba(88, 36, 68, 0.1) 42%, transparent 74%), #0d0b14;
        color: #f6f4fa;
      }
      .boot-bar {
        height: 56px;
        padding: 0 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #131722;
        border-bottom: 1px solid #2a2e39;
      }
      html.arctic .boot-bar {
        background: #ffffff;
        border-bottom-color: #dce2ea;
      }
      html.parchment .boot-bar {
        background: #fcf9f2;
        border-bottom-color: #d8cfbc;
      }
      html.velvet .boot-bar {
        background: #161320;
        border-bottom-color: #2d2842;
      }
      html.velvet .boot-dot {
        background: #f9574b;
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 16px;
        letter-spacing: -0.02em;
      }
      .boot-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #2962ff;
      }
      .boot-pill {
        font-size: 11px;
        font-weight: 700;
        opacity: 0.72;
      }
      .boot-body {
        max-width: 1440px;
        width: 100%;
        margin: 0 auto;
        padding: 18px;
        display: grid;
        gap: 14px;
      }
      .boot-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
      }
      .boot-card {
        position: relative;
        overflow: hidden;
        height: 70px;
        border-radius: 12px;
        background: #131722;
        border: 1px solid #2a2e39;
      }
      .boot-main {
        position: relative;
        overflow: hidden;
        height: 360px;
        border-radius: 14px;
        background: #131722;
        border: 1px solid #2a2e39;
      }
      .boot-card::after,
      .boot-main::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(41, 98, 255, 0.12) 45%,
          rgba(255, 255, 255, 0.08) 55%,
          transparent 100%
        );
        animation: boot-shimmer 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        will-change: transform;
      }
      html.arctic .boot-card,
      html.arctic .boot-main {
        background: #ffffff;
        border-color: #dce2ea;
      }
      html.parchment .boot-card,
      html.parchment .boot-main {
        background: #fdfbf7;
        border-color: #d8cfbc;
      }
      html.velvet .boot-card,
      html.velvet .boot-main {
        background: #161320;
        border-color: #2d2842;
      }
      html.velvet .boot-card::after,
      html.velvet .boot-main::after {
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(249, 87, 75, 0.12) 45%,
          rgba(255, 255, 255, 0.06) 55%,
          transparent 100%
        );
      }
      html.arctic .boot-card::after,
      html.arctic .boot-main::after,
      html.parchment .boot-card::after,
      html.parchment .boot-main::after {
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(29, 78, 216, 0.08) 50%,
          transparent 100%
        );
      }
      @keyframes boot-shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-card::after,
        .boot-main::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="antialiased selection:bg-[#0066CC] dark:selection:bg-[#0066CC] selection:text-white">
    <div id="root">
      <div id="boot-shell" aria-busy="true" aria-label="Loading Stocks Global Market Terminal">
        <div class="boot-bar">
          <div class="boot-brand">
            <span class="boot-dot"></span>
            <span>Stocks</span>
          </div>
          <span id="boot-status" class="boot-pill">Initializing live feeds...</span>
        </div>
        <div class="boot-body">
          <div class="boot-strip">
            <div class="boot-card"></div>
            <div class="boot-card"></div>
            <div class="boot-card"></div>
            <div class="boot-card"></div>
            <div class="boot-card"></div>
            <div class="boot-card"></div>
          </div>
          <div class="boot-main"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var isDev = !!document.querySelector('script[src*="/@vite/client"]');
        if (isDev && 'serviceWorker' in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              if (!regs || regs.length === 0) return;
              Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
                if ('caches' in window) {
                  caches.keys().then(function (ks) {
                    return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                  }).catch(function () {});
                }
              }).catch(function () {});
            }).catch(function () {});
          } catch (e) {}
        }

        function showRetry(msg) {
          if (window.__STOCKS_MOUNTED__) return;
          var shell = document.getElementById('boot-shell');
          var pill = document.getElementById('boot-status');
          if (!shell || !pill) return;
          pill.textContent = msg + ' ';
          if (!document.getElementById('boot-retry-btn')) {
            var btn = document.createElement('button');
            btn.id = 'boot-retry-btn';
            btn.type = 'button';
            btn.textContent = 'Tap to Reload';
            btn.style.cssText = 'margin-left:8px;padding:4px 10px;border-radius:999px;border:1px solid rgba(56,189,248,0.5);background:rgba(56,189,248,0.16);color:inherit;font-weight:700;font-size:11px;cursor:pointer;';
            btn.onclick = function () {
              try {
                if ('caches' in window) {
                  caches.keys().then(function (ks) {
                    return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                  }).finally(function () { window.location.reload(); });
                  return;
                }
              } catch (e) {}
              window.location.reload();
            };
            pill.appendChild(btn);
          }
        }

        function autoRecoverOnce(reason) {
          if (window.__STOCKS_MOUNTED__) return;
          try {
            var k = 'stocks-boot-recover-ts';
            var prev = Number(sessionStorage.getItem(k) || '0');
            if (!prev || Date.now() - prev > 30000) {
              sessionStorage.setItem(k, String(Date.now()));
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all((regs || []).map(function (r) { return r.unregister(); }));
                }).finally(function () { window.location.reload(); });
                return;
              }
              window.location.reload();
              return;
            }
          } catch (e) {}
          showRetry(reason || 'Boot interrupted');
        }

        window.addEventListener('error', function (ev) {
          if (window.__STOCKS_MOUNTED__) return;
          var target = ev && ev.target;
          if (target && target.tagName === 'SCRIPT') {
            autoRecoverOnce('Module load failed');
          } else if (ev && ev.message) {
            showRetry('Startup error');
          }
        }, true);

        window.addEventListener('unhandledrejection', function (ev) {
          if (window.__STOCKS_MOUNTED__) return;
          var msg = (ev && ev.reason && ev.reason.message) ? ev.reason.message : '';
          if (/dynamically imported|module|script/i.test(msg)) {
            autoRecoverOnce('Module load failed');
          }
        });

        window.setTimeout(function () {
          if (!window.__STOCKS_MOUNTED__ && document.getElementById('boot-shell')) {
            showRetry('Slow connection — tap to reload');
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
